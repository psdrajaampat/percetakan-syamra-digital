name = "syamra-digital"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

# KV namespace untuk menyimpan data konten (harga, layanan, galeri, owner, kontak)
# Buat dengan: wrangler kv namespace create SITE_CONTENT
# Lalu isi "id" di bawah dengan id yang dihasilkan.
[[kv_namespaces]]
binding = "SITE_CONTENT"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# R2 bucket untuk menyimpan file gambar upload (galeri, foto owner)
# Buat dengan: wrangler r2 bucket create syamra-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "syamra-uploads"

# Secrets (JANGAN taruh nilai asli di sini — set lewat dashboard atau CLI):
#   wrangler pages secret put ADMIN_PASSWORD
#   wrangler pages secret put SESSION_SECRET
